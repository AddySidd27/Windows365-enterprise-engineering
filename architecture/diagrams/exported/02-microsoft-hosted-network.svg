<text x="55" y="65" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#172b4d">Microsoft Entra Join with Microsoft-hosted Network</text>
<text x="55" y="102" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="18" fill="#5c6675">Windows 365 Enterprise — the Microsoft-managed network model</text>
<text x="80" y="184" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">How to read this diagram</text>
<text x="142" y="220" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Microsoft-managed Windows 365 service</text>
<text x="142" y="252" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Azure subscription (owned by Microsoft here)</text>
<text x="142" y="284" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Your Microsoft 365 tenant (customer)</text>
<text x="142" y="316" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Management or sign-in flow</text>
<text x="142" y="348" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Two-way arrow: user session</text>
<text x="1290.0" y="174" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#172b4d">Customer Microsoft 365 tenant</text>
<text x="1150.0" y="249.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Microsoft Intune</text>
<text x="1150.0" y="274.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Cloud PC management</text>
<text x="1430.0" y="249.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Microsoft Entra ID</text>
<text x="1430.0" y="274.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Sign-in and device identity</text>
<text x="55" y="515" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#172b4d">User device</text>
<text x="182.5" y="599.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Windows App</text>
<text x="182.5" y="624.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Or a web browser</text>
<text x="182.5" y="649.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Windows • macOS • mobile</text>
<text x="183" y="720" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Windows App is Microsoft's</text>
<text x="183" y="742" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">client app for Cloud PCs.</text>
<text x="430" y="495" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ca5010">Managed by Microsoft — Windows 365 service</text>
<text x="575.0" y="641.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#172b4d">AVD gateway and broker</text>
<text x="575.0" y="666.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Reverse connect</text>
<text x="575.0" y="691.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">(outbound only)</text>
<text x="830" y="552" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#172b4d">Azure subscription</text>
<text x="830" y="576" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#5c6675">Owned by Microsoft</text>
<text x="1035.0" y="671.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Cloud PC</text>
<text x="1035.0" y="696.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Entra joined • Intune enrolled</text>
<text x="1035.0" y="721.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Windows 11 Enterprise</text>
<text x="1515.0" y="674.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#172b4d">Cloud PC NIC</text>
<text x="1515.0" y="696.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Network card</text>
<text x="1515.0" y="718.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">run by Microsoft</text>
<text x="1330" y="676" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#ca5010">attached</text>
<text x="1085" y="385" text-anchor="end" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#107c10">Management and policy</text>
<text x="1195" y="385" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#107c10">Sign-in and device identity</text>
<text x="900" y="885" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">No customer Azure subscription, virtual network, subnet, or Azure network connection is needed.</text>
<text x="77" y="942" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Terms used in this diagram</text>
<text x="77.0" y="972" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">AVD (Azure Virtual Desktop) gateway and broker: Microsoft services that route the session and match the user to a Cloud PC.</text>
<text x="77.0" y="998" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Reverse connect: the Cloud PC opens an outbound connection to the service, so no inbound port is opened to it.</text>
<text x="77.0" y="1024" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">NIC (network interface card): the virtual network adapter of the Cloud PC. Here Microsoft manages it in its own subscription.</text>
<text x="55" y="1072" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" fill="#5c6675">Source: Microsoft Learn, Windows 365 network deployment options (learn.microsoft.com/windows-365/enterprise/windows-365-network-deployment-options)</text>
</svg>