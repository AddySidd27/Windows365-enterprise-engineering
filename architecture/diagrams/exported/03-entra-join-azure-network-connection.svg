<text x="55" y="65" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#172b4d">Microsoft Entra Join with Azure Network Connection</text>
<text x="55" y="102" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="18" fill="#5c6675">Windows 365 Enterprise — the customer-managed network model</text>
<text x="80" y="184" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">How to read this diagram</text>
<text x="142" y="220" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Microsoft-managed Windows 365 service</text>
<text x="142" y="252" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Azure subscription (Microsoft or customer)</text>
<text x="142" y="284" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Your Microsoft 365 tenant</text>
<text x="142" y="316" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Management, sign-in, or network flow</text>
<text x="142" y="348" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Cloud PC NIC attachment to your subnet</text>
<text x="1015.0" y="174" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#172b4d">Customer Microsoft 365 tenant</text>
<text x="890.0" y="249.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Microsoft Intune</text>
<text x="890.0" y="274.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Policy and management</text>
<text x="1150.0" y="249.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Microsoft Entra ID</text>
<text x="1150.0" y="274.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Identity and sign-in</text>
<text x="55" y="560" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#172b4d">User device</text>
<text x="182.5" y="644.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Windows App</text>
<text x="182.5" y="669.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Or a web browser</text>
<text x="182.5" y="694.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Windows • macOS • mobile</text>
<text x="183" y="765" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Windows App is Microsoft's</text>
<text x="183" y="787" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">client app for Cloud PCs.</text>
<text x="410" y="495" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ca5010">Managed by Microsoft — Windows 365 service</text>
<text x="530.0" y="641.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#172b4d">AVD gateway and broker</text>
<text x="530.0" y="666.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Reverse connect</text>
<text x="530.0" y="691.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">(outbound only)</text>
<text x="720" y="552" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#172b4d">Azure subscription</text>
<text x="720" y="576" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#5c6675">Owned by Microsoft</text>
<text x="905.0" y="691.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Cloud PC compute</text>
<text x="905.0" y="716.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Entra joined</text>
<text x="905.0" y="741.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Intune enrolled</text>
<text x="1260.0" y="693.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#172b4d">Azure network</text>
<text x="1260.0" y="718.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">connection (ANC)</text>
<text x="1260.0" y="740.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">points to your subnet</text>
<text x="1260" y="805" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#ca5010">NIC attachment</text>
<text x="1670.0" y="482" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#172b4d">Customer Azure subscription</text>
<text x="1670.0" y="506" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#5c6675">Customer owns and manages the network</text>
<text x="1430" y="572" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Customer virtual network (VNet)</text>
<text x="1567" y="632" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Cloud PC subnet</text>
<text x="1567.5" y="705.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#172b4d">Cloud PC NIC</text>
<text x="1567.5" y="727.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Created by Windows 365</text>
<text x="945" y="405" text-anchor="end" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#107c10">Management and policy</text>
<text x="1065" y="405" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#107c10">Sign-in and device identity</text>
<text x="1827.5" y="694.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#172b4d">Network controls</text>
<text x="1827.5" y="719.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">DNS</text>
<text x="1827.5" y="744.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">NSG</text>
<text x="1827.5" y="769.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">UDR</text>
<text x="1827.5" y="794.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Firewall / NVA</text>
<text x="1827.5" y="819.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">NAT gateway</text>
<text x="2125" y="548" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Possible destinations</text>
<text x="2125" y="570" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">(set by your routes)</text>
<text x="2125.0" y="634.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Internet</text>
<text x="2125.0" y="659.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Your outbound path</text>
<text x="2125.0" y="764.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Private Azure</text>
<text x="2125.0" y="789.0" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Azure apps, services</text>
<text x="2125.0" y="881.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">On-premises</text>
<text x="2125.0" y="906.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Optional VPN or</text>
<text x="2125.0" y="931.5" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">ExpressRoute</text>
<text x="77" y="1012" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Terms used in this diagram</text>
<text x="77.0" y="1042" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">DNS (Domain Name System): turns names into IP addresses.</text>
<text x="77.0" y="1068" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">NSG (network security group): allow or deny rules for network traffic.</text>
<text x="77.0" y="1094" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">UDR (user-defined route): your own route that overrides default routing.</text>
<text x="77.0" y="1120" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Firewall / NVA (network virtual appliance): a firewall or inspection device you run.</text>
<text x="77.0" y="1146" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">NAT gateway: outbound internet access; new ANC VNets need an explicit outbound method.</text>
<text x="1125.0" y="1042" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">ANC (Azure network connection): tells Windows 365 which subscription, VNet, and subnet to use.</text>
<text x="1125.0" y="1068" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">VNet: virtual network.  NIC: virtual network card of the Cloud PC.</text>
<text x="1125.0" y="1094" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">AVD (Azure Virtual Desktop) gateway and broker: route the session and match user to Cloud PC.</text>
<text x="1125.0" y="1120" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#364152">Reverse connect: the Cloud PC dials out, so no inbound port is opened.</text>
<text x="1125.0" y="1230" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#172b4d">The Azure network connection tells Windows 365 which subscription, virtual network, and subnet to place the Cloud PC NIC in.</text>
<text x="1125.0" y="1258" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">Only the NIC is in your subscription; the Cloud PC compute stays in the Microsoft-managed subscription.</text>
<text x="1125.0" y="1286" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">You manage IP capacity, DNS, routing, security, private connectivity, and internet egress. Send required Windows 365 and AVD</text>
<text x="1125.0" y="1314" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" fill="#364152">service traffic directly to Microsoft's network; do not route it through on-premises egress.</text>
<text x="55" y="1367" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" fill="#5c6675">Source: Microsoft Learn, Windows 365 network deployment options (learn.microsoft.com/windows-365/enterprise/windows-365-network-deployment-options)</text>
</svg>