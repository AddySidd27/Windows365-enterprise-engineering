 <path d="M1250 310v85h-125v275h-95" stroke="#107c10" stroke-width="4" fill="none" marker-end="url(#greenArrow)"/><text x="1180" y="387" text-anchor="end" class="t sm green">Management and policy</text>
 <path d="M1540 310v100h-400v345h-110" stroke="#107c10" stroke-width="4" fill="none" marker-end="url(#greenArrow)"/><text x="1460" y="402" text-anchor="end" class="t sm green">Identity and authentication</text>

 <text x="1000" y="995" text-anchor="middle" class="t ct">Azure Network Connection selects the customer subscription, virtual network, and subnet.</text>
 <text x="1000" y="1028" text-anchor="middle" class="t b">The customer manages IP capacity, DNS, routing, security, private connectivity, and internet egress.</text>
