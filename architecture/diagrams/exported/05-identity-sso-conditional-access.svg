<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563a9"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#107c10"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#744da9"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#ca5010"/></marker>
    <style>
      .t{font-family:'Segoe UI',Arial,sans-serif;fill:#172b4d}.title{font-size:31px;font-weight:700}.sub{font-size:17px;fill:#5c6675}.section{font-size:20px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:14px;fill:#364152}.small{font-size:12px;fill:#5c6675}.blue{fill:#2563a9}.green{fill:#107c10}.purple{fill:#744da9}.orange{fill:#ca5010}
    </style>
  </defs>
  <rect width="1800" height="900" fill="#ffffff"/>
  <text x="45" y="58" class="t title">Windows 365 User Sign-in and Conditional Access Flow</text>
  <text x="45" y="92" class="t sub">Connecting-device compliance, Microsoft Entra access controls, Windows 365 resources, SSO, and Cloud PC sign-in</text>

  <rect x="35" y="125" width="1730" height="590" rx="18" fill="#ffffff" stroke="#264a8a" stroke-width="3"/>
  <text x="65" y="166" class="t section">User connection flow</text>

  <rect x="55" y="330" width="240" height="190" rx="12" fill="#ffffff" stroke="#8a94a6" stroke-width="2"/>
  <text x="175" y="370" text-anchor="middle" class="t head">1. User endpoint</text>
  <text x="175" y="407" text-anchor="middle" class="t body">Windows App or</text>
  <text x="175" y="433" text-anchor="middle" class="t body">windows.cloud.microsoft</text>
  <text x="175" y="470" text-anchor="middle" class="t small">Connecting device</text>
  <text x="175" y="492" text-anchor="middle" class="t small">requests Windows 365 access</text>

  <rect x="360" y="305" width="270" height="240" rx="12" fill="#f8f4fc" stroke="#744da9" stroke-width="3"/>
  <text x="495" y="345" text-anchor="middle" class="t head">2. Microsoft Entra ID</text>
  <text x="495" y="375" text-anchor="middle" class="t head purple">Conditional Access</text>
  <text x="495" y="416" text-anchor="middle" class="t body">Authenticates the user</text>
  <text x="495" y="442" text-anchor="middle" class="t body">and evaluates policy</text>
  <path d="M400 464h190" stroke="#744da9"/>
  <text x="495" y="491" text-anchor="middle" class="t small">Lab: MFA report-only</text>
  <text x="495" y="516" text-anchor="middle" class="t body">Next: compliant-device pilot</text>

  <rect x="695" y="330" width="240" height="190" rx="12" fill="#eef8ff" stroke="#0078d4" stroke-width="3"/>
  <text x="815" y="370" text-anchor="middle" class="t head">3. Windows 365</text>
  <text x="815" y="406" text-anchor="middle" class="t body">Lists assigned Cloud PCs</text>
  <text x="815" y="432" text-anchor="middle" class="t body">and supports actions</text>
  <text x="815" y="458" text-anchor="middle" class="t body">such as Restart</text>
  <text x="815" y="492" text-anchor="middle" class="t small">Resource app</text>

  <rect x="1000" y="330" width="240" height="190" rx="12" fill="#eef8ff" stroke="#0078d4" stroke-width="3"/>
  <text x="1120" y="370" text-anchor="middle" class="t head">4. Gateway</text>
  <text x="1120" y="406" text-anchor="middle" class="t body">Authenticates the</text>
  <text x="1120" y="432" text-anchor="middle" class="t body">Cloud PC connection</text>
  <text x="1120" y="458" text-anchor="middle" class="t small orange">Conditional Access app:</text>
  <text x="1120" y="480" text-anchor="middle" class="t small orange">Azure Virtual Desktop</text>

  <rect x="1305" y="330" width="240" height="190" rx="12" fill="#f8f4fc" stroke="#744da9" stroke-width="3"/>
  <text x="1425" y="370" text-anchor="middle" class="t head">5. Windows Cloud Login</text>
  <text x="1425" y="406" text-anchor="middle" class="t body">Authenticates the user</text>
  <text x="1425" y="432" text-anchor="middle" class="t body">to the Cloud PC</text>
  <text x="1425" y="468" text-anchor="middle" class="t green">Used when SSO is enabled</text>
  <text x="1425" y="492" text-anchor="middle" class="t small">No second credential prompt</text>

  <rect x="1600" y="330" width="135" height="190" rx="12" fill="#f2fbf2" stroke="#107c10" stroke-width="3"/>
  <text x="1667" y="375" text-anchor="middle" class="t head green">6. Cloud PC</text>
  <text x="1667" y="416" text-anchor="middle" class="t body">Windows</text>
  <text x="1667" y="442" text-anchor="middle" class="t body">desktop</text>
  <text x="1667" y="480" text-anchor="middle" class="t small">Session starts</text>

  <path d="M295 425h65" stroke="#2563a9" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M630 425h65" stroke="#2563a9" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M935 425h65" stroke="#2563a9" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M1240 425h65" stroke="#107c10" stroke-width="5" fill="none" marker-end="url(#arrow-green)"/>
  <text x="1272" y="407" text-anchor="middle" class="t small green">SSO</text>
  <path d="M1545 425h55" stroke="#107c10" stroke-width="5" fill="none" marker-end="url(#arrow-green)"/>

  <rect x="360" y="195" width="270" height="82" rx="10" fill="#eef8ff" stroke="#0078d4" stroke-width="2"/>
  <text x="495" y="226" text-anchor="middle" class="t head">Microsoft Intune</text>
  <text x="495" y="252" text-anchor="middle" class="t body">Connecting-device compliance</text>
  <path d="M495 277v28" stroke="#744da9" stroke-width="4" fill="none" marker-end="url(#arrow-purple)"/>
  <text x="512" y="297" class="t small purple">Compliance signal</text>

  <path d="M1120 520v100h547v-100" stroke="#ca5010" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="1240" y="594" width="310" height="42" rx="8" fill="#ffffff"/>
  <text x="1395" y="614" text-anchor="middle" class="t small orange">Without SSO: Cloud PC credentials are prompted</text>

  <path d="M630 310v-30h915v30" stroke="#744da9" stroke-width="2.5" stroke-dasharray="8 7" fill="none"/>
  <rect x="825" y="255" width="520" height="42" rx="8" fill="#ffffff"/>
  <text x="1085" y="276" text-anchor="middle" class="t small purple">Use matching Conditional Access intent across the relevant resource apps</text>

  <rect x="35" y="745" width="1730" height="110" rx="14" fill="#f7f9fb" stroke="#8a94a6" stroke-width="2"/>
  <text x="65" y="780" class="t head">Conditional Access target resources</text>
  <text x="65" y="812" class="t body">Windows 365 — portal, Cloud PC list, and service actions</text>
  <text x="625" y="812" class="t body">Azure Virtual Desktop — gateway connection</text>
  <text x="1125" y="812" class="t body">Windows Cloud Login — Cloud PC authentication with SSO</text>
  <text x="65" y="838" class="t small orange">Start in report-only mode. Validate the pilot user, emergency-account exclusion, What If results, and Entra sign-in logs before enforcement.</text>
  <text x="900" y="885" text-anchor="middle" class="t small">Microsoft Learn basis: Set Conditional Access policies for Windows 365.</text>
</svg>
