<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#64748b"/></marker><style>.title{font:700 38px 'Segoe UI',Arial;fill:#17365d}.sub{font:20px 'Segoe UI',Arial;fill:#475569}.h{font:700 22px 'Segoe UI',Arial;fill:#fff}.bh{font:700 22px 'Segoe UI',Arial;fill:#17365d}.t{font:18px 'Segoe UI',Arial;fill:#334155}.sm{font:16px 'Segoe UI',Arial;fill:#475569}.step{fill:#e8f3fb;stroke:#0078d4;stroke-width:2}.keep{fill:#fff;stroke:#107c10;stroke-width:2}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1900" height="1120" fill="#fff"/><text x="950" y="58" text-anchor="middle" class="title">Windows 365 Enterprise Cloud PC Lifecycle Operations</text><text x="950" y="92" text-anchor="middle" class="sub">Choose the least disruptive documented action, protect data, monitor the service, and validate the result</text>
<g><rect x="70" y="135" width="360" height="120" rx="12" class="step"/><rect x="70" y="135" width="360" height="42" rx="12" fill="#0078d4"/><text x="250" y="164" text-anchor="middle" class="h">1  Operational requirement</text><text x="95" y="204" class="t">Identify the user, Cloud PC,</text><text x="95" y="231" class="t">current state, and required outcome.</text>
<rect x="515" y="135" width="390" height="120" rx="12" class="step"/><rect x="515" y="135" width="390" height="42" rx="12" fill="#0078d4"/><text x="710" y="164" text-anchor="middle" class="h">2  Safety gate</text><text x="540" y="204" class="t">Notify user • save and sign out</text><text x="540" y="231" class="t">Protect data • baseline • approval</text>
<rect x="990" y="135" width="360" height="120" rx="12" class="step"/><rect x="990" y="135" width="360" height="42" rx="12" fill="#0078d4"/><text x="1170" y="164" text-anchor="middle" class="h">3  Select and run action</text><text x="1015" y="204" class="t">Run the selected Windows 365</text><text x="1015" y="231" class="t">action and monitor its status.</text>
<rect x="1435" y="135" width="395" height="120" rx="12" class="step"/><rect x="1435" y="135" width="395" height="42" rx="12" fill="#0078d4"/><text x="1632" y="164" text-anchor="middle" class="h">4  Validate and record</text><text x="1460" y="204" class="t">Access • management • compliance</text><text x="1460" y="231" class="t">Security • apps • data • evidence</text></g>
<path d="M430 195H500" class="line"/><path d="M905 195H975" class="line"/><path d="M1350 195H1420" class="line"/>
<rect x="70" y="320" width="1760" height="425" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="105" y="365" class="bh">Choose one action that retains the existing Cloud PC</text><text x="105" y="395" class="sm">No reprovision. Service and user impact differs by action.</text>
<g><rect x="105" y="435" width="390" height="245" rx="14" class="keep"/><rect x="105" y="435" width="390" height="48" rx="14" fill="#107c10"/><text x="300" y="467" text-anchor="middle" class="h">Restart</text><text x="135" y="525" class="t">Standard operating-system reboot</text><text x="135" y="562" class="t">• Stored data retained</text><text x="135" y="594" class="t">• Short session interruption</text><text x="135" y="626" class="t">• Unsaved work can be lost</text>
<rect x="535" y="435" width="390" height="245" rx="14" class="keep"/><rect x="535" y="435" width="390" height="48" rx="14" fill="#107c10"/><text x="730" y="467" text-anchor="middle" class="h">Resize</text><text x="565" y="525" class="t">Change CPU, RAM, or disk capacity</text><text x="565" y="562" class="t">• User and disk data retained</text><text x="565" y="594" class="t">• Disk increase only</text><text x="565" y="626" class="t">• GPU Cloud PCs unsupported</text>
<rect x="965" y="435" width="390" height="245" rx="14" class="keep"/><rect x="965" y="435" width="390" height="48" rx="14" fill="#107c10"/><text x="1160" y="467" text-anchor="middle" class="h">Move</text><text x="995" y="525" class="t">Supported region or network change</text><text x="995" y="562" class="t">• Existing Cloud PC retained</text><text x="995" y="594" class="t">• Join type cannot change</text><text x="995" y="626" class="t">• Old restore points deleted</text>
<rect x="1395" y="435" width="390" height="245" rx="14" class="keep"/><rect x="1395" y="435" width="390" height="48" rx="14" fill="#107c10"/><text x="1590" y="467" text-anchor="middle" class="h">Point-in-time Restore</text><text x="1425" y="525" class="t">Return to a selected earlier state</text><text x="1425" y="562" class="t">• Same Cloud PC retained</text><text x="1425" y="594" class="t">• Later local changes are lost</text><text x="1425" y="626" class="t">• Credential conflicts are possible</text></g>
<rect x="70" y="790" width="1760" height="225" rx="18" fill="#fff8f8" stroke="#d13438" stroke-width="2"/><rect x="105" y="835" width="440" height="135" rx="14" fill="#fff" stroke="#d13438" stroke-width="2"/><rect x="105" y="835" width="440" height="48" rx="14" fill="#d13438"/><text x="325" y="867" text-anchor="middle" class="h">Reprovision — destructive</text><text x="135" y="918" class="t">Wipe the current Cloud PC and build a new</text><text x="135" y="950" class="t">one from the current provisioning policy.</text><text x="610" y="842" class="bh">Required controls</text><text x="610" y="882" class="t">Explicit approval • protected user data • exported evidence • healthy current policy</text><text x="610" y="920" class="t">All local data, apps, and customizations are deleted. A new device name is common.</text><text x="610" y="958" class="t">After completion, validate the result as a new managed device.</text>
<text x="70" y="1080" class="sm">Legend: blue = operating workflow • green = existing Cloud PC retained • red = wipe and rebuild</text></svg>
