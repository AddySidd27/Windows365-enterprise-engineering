  <rect x="1480" y="800" width="185" height="72" rx="10" fill="#fff" stroke="#0078d4" stroke-width="2"/><text x="1573" y="829" text-anchor="middle" class="t ct">Private connectivity</text><text x="1573" y="854" text-anchor="middle" class="t sm">Peering • S2S VPN • ER</text>
 </g>

 <g><rect x="1780" y="450" width="370" height="520" rx="12" fill="#fffdf7" stroke="#8a6d1d" stroke-width="3"/><text x="1965" y="480" text-anchor="middle" class="t zh">Customer Active Directory</text><text x="1965" y="507" text-anchor="middle" class="t b">Windows Server AD DS • Azure or on-premises</text>
  <rect x="1825" y="525" width="280" height="175" rx="10" fill="#fff" stroke="#8a6d1d" stroke-width="2"/><text x="1965" y="558" text-anchor="middle" class="t ct" style="font-size:16px">Windows Server Active Directory</text><text x="1965" y="585" text-anchor="middle" class="t sm">AD DS domain controllers</text><text x="1965" y="612" text-anchor="middle" class="t b">Domain join and user authentication</text><text x="1965" y="639" text-anchor="middle" class="t b">AD-integrated DNS (two or more)</text><text x="1965" y="670" text-anchor="middle" class="t b">GPO or Intune MDM management</text>
