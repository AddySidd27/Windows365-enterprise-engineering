 <text x="1100" y="1045" text-anchor="middle" class="t ct">Microsoft Entra hybrid join requires AD DS DNS resolution and domain-controller line of sight for provisioning and sign-in.</text>
 <text x="1100" y="1078" text-anchor="middle" class="t b">The customer VNet region determines Cloud PC placement. Keep AVD and Windows 365 service endpoints reachable over supported outbound paths.</text>
 <text x="1100" y="1111" text-anchor="middle" class="t b">No direct inbound Internet connection is used for normal Cloud PC access; user connectivity is provided through Azure Virtual Desktop reverse connect.</text>
 <text x="1100" y="1144" text-anchor="middle" class="t b">Microsoft Entra Domain Services isn't supported for the Microsoft Entra hybrid join model.</text>
</svg>
