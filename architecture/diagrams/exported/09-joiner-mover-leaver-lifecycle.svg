<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120">
  <defs>
    <style>.t{font-family:'Segoe UI',Arial,sans-serif;fill:#172b4d}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#5c6675}.section{font-size:21px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#5c6675}.blue{fill:#2563a9}.green{fill:#107c10}.orange{fill:#ca5010}.purple{fill:#744da9}.red{fill:#c50f1f}</style>
    <marker id="ba" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#2563a9"/></marker>
    <marker id="ga" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#107c10"/></marker>
    <marker id="oa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#ca5010"/></marker>
    <marker id="ra" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#c50f1f"/></marker>
  </defs>

  <rect width="1900" height="1120" fill="#fff"/>
  <text x="45" y="58" class="t title">Windows 365 Enterprise Joiner, Mover, and Leaver Lifecycle</text>
  <text x="45" y="92" class="t sub">Identity-driven eligibility, controlled persona changes, immediate access removal, grace period, and deprovisioning</text>

  <rect x="35" y="125" width="1830" height="245" rx="18" fill="#f7f9fc" stroke="#264a8a" stroke-width="3"/>
  <text x="65" y="162" class="t section">Customer identity and assignment plane</text>

  <rect x="75" y="200" width="285" height="120" rx="12" fill="#fff" stroke="#8a94a6" stroke-width="2"/>
  <text x="217" y="235" text-anchor="middle" class="t head">1. Authoritative identity source</text>
  <text x="217" y="270" text-anchor="middle" class="t body">Join, role change, or departure</text>
  <text x="217" y="296" text-anchor="middle" class="t small">Approved attributes and effective date</text>

  <rect x="420" y="200" width="285" height="120" rx="12" fill="#f7f2fb" stroke="#744da9" stroke-width="3"/>
  <text x="562" y="235" text-anchor="middle" class="t head purple">2. Microsoft Entra ID user</text>
  <text x="562" y="270" text-anchor="middle" class="t body">Account and lifecycle attributes</text>
  <text x="562" y="296" text-anchor="middle" class="t small">Identity state drives group membership</text>

  <rect x="765" y="185" width="430" height="150" rx="12" fill="#f7f2fb" stroke="#744da9" stroke-width="3"/>
  <text x="980" y="220" text-anchor="middle" class="t head purple">3. Separate Microsoft Entra groups</text>
  <text x="800" y="255" class="t body">Persona eligibility</text><text x="995" y="255" class="t body">Windows 365 license SKU</text>
  <text x="800" y="285" class="t body">Provisioning policy</text><text x="995" y="285" class="t body">User apps and settings</text>
  <text x="980" y="310" text-anchor="middle" class="t small">Use discrete groups and avoid overlapping provisioning assignments</text>
  <text x="980" y="329" text-anchor="middle" class="t small">Provisioning-policy assignments do not support nested groups</text>

  <rect x="1260" y="185" width="545" height="150" rx="12" fill="#eef8ff" stroke="#0078d4" stroke-width="3"/>
  <text x="1532" y="220" text-anchor="middle" class="t head blue">4. Windows 365 and Microsoft Intune control plane</text>
  <text x="1532" y="255" text-anchor="middle" class="t body">Checks the Windows 365 license and provisioning-policy assignment</text>
  <text x="1532" y="285" text-anchor="middle" class="t body">Provisions the Cloud PC, enrolls it, applies policy, and reports status</text>
  <text x="1532" y="315" text-anchor="middle" class="t small">Customer configuration; Cloud PC compute remains Microsoft hosted</text>

  <path d="M360 260h60" stroke="#2563a9" stroke-width="5" fill="none" marker-end="url(#ba)"/>
  <path d="M705 260h60" stroke="#744da9" stroke-width="5" fill="none" marker-end="url(#ba)"/>
  <path d="M1195 260h65" stroke="#744da9" stroke-width="5" fill="none" marker-end="url(#ba)"/>

  <rect x="35" y="400" width="565" height="625" rx="18" fill="#f7fbff" stroke="#0078d4" stroke-width="3"/>
  <text x="65" y="442" class="t section blue">JOINER — create controlled access</text>

  <rect x="85" y="475" width="465" height="78" rx="10" fill="#fff" stroke="#744da9" stroke-width="2"/>
  <text x="317" y="505" text-anchor="middle" class="t head">1. Identity and attributes are ready</text>
  <text x="317" y="532" text-anchor="middle" class="t small">Manager, persona, location, and start date are validated</text>
  <path d="M317 553v32" stroke="#2563a9" stroke-width="4" fill="none" marker-end="url(#ba)"/>

  <rect x="85" y="585" width="465" height="92" rx="10" fill="#f7f2fb" stroke="#744da9" stroke-width="2"/>
  <text x="317" y="615" text-anchor="middle" class="t head purple">2. Assign the correct control groups</text>
  <text x="317" y="643" text-anchor="middle" class="t body">License SKU + provisioning policy + persona access</text>
  <text x="317" y="665" text-anchor="middle" class="t small">Both license and provisioning eligibility are required</text>
  <path d="M317 677v32" stroke="#2563a9" stroke-width="4" fill="none" marker-end="url(#ba)"/>

  <rect x="85" y="709" width="465" height="92" rx="10" fill="#eef8ff" stroke="#0078d4" stroke-width="2"/>
  <text x="317" y="739" text-anchor="middle" class="t head blue">3. Windows 365 provisions the Cloud PC</text>
  <text x="317" y="767" text-anchor="middle" class="t body">Policy selects network, image, region, join type, and SSO</text>
  <text x="317" y="789" text-anchor="middle" class="t small">Monitor Provisioning, Failed, or Provisioned with warnings</text>
  <path d="M317 801v32" stroke="#107c10" stroke-width="4" fill="none" marker-end="url(#ga)"/>

  <rect x="85" y="833" width="465" height="78" rx="10" fill="#f2fbf2" stroke="#107c10" stroke-width="2"/>
  <text x="317" y="863" text-anchor="middle" class="t head green">4. Entra joined and Intune enrolled</text>
  <text x="317" y="890" text-anchor="middle" class="t small">Apply device policy, apps, security, compliance, and updates</text>
  <path d="M317 911v30" stroke="#107c10" stroke-width="4" fill="none" marker-end="url(#ga)"/>

  <rect x="85" y="941" width="465" height="58" rx="10" fill="#f2fbf2" stroke="#107c10" stroke-width="2"/>
  <text x="317" y="976" text-anchor="middle" class="t head green">5. Validate user connection and baseline</text>

  <rect x="630" y="400" width="610" height="625" rx="18" fill="#fffaf5" stroke="#ca5010" stroke-width="3"/>
  <text x="660" y="442" class="t section orange">MOVER — select the least disruptive action</text>

  <rect x="680" y="475" width="510" height="78" rx="10" fill="#fff" stroke="#744da9" stroke-width="2"/>
  <text x="935" y="505" text-anchor="middle" class="t head">1. Approved persona or role change</text>
  <text x="935" y="532" text-anchor="middle" class="t small">Compare target license, network, image, apps, and access</text>
  <path d="M935 553v32" stroke="#ca5010" stroke-width="4" fill="none" marker-end="url(#oa)"/>

  <polygon points="935,585 1080,650 935,715 790,650" fill="#fff4e8" stroke="#ca5010" stroke-width="3"/>
  <text x="935" y="640" text-anchor="middle" class="t head orange">Can the current Cloud PC</text>
  <text x="935" y="665" text-anchor="middle" class="t head orange">meet the target state?</text>

  <rect x="675" y="745" width="245" height="145" rx="10" fill="#f2fbf2" stroke="#107c10" stroke-width="2"/>
  <text x="797" y="775" text-anchor="middle" class="t head green">Preserve</text>
  <text x="797" y="803" text-anchor="middle" class="t body">Update apps and access</text>
  <text x="797" y="829" text-anchor="middle" class="t body">Resize compute if required</text>
  <text x="797" y="854" text-anchor="middle" class="t small">Validate before source removal</text>

  <rect x="950" y="745" width="245" height="145" rx="10" fill="#fff4e8" stroke="#ca5010" stroke-width="2"/>
  <text x="1072" y="775" text-anchor="middle" class="t head orange">Change platform state</text>
  <text x="1072" y="803" text-anchor="middle" class="t body">Move: supported region / network</text>
  <text x="1072" y="827" text-anchor="middle" class="t body">Reprovision: image change</text>
  <text x="1072" y="851" text-anchor="middle" class="t body">New Cloud PC: join-type change</text>
  <text x="1072" y="878" text-anchor="middle" class="t small">Protect data before destructive work</text>

  <path d="M790 650h-35v95" stroke="#107c10" stroke-width="4" fill="none" marker-end="url(#ga)"/>
  <text x="730" y="675" text-anchor="middle" class="t small green">Yes</text>
  <path d="M1080 650h35v95" stroke="#ca5010" stroke-width="4" fill="none" marker-end="url(#oa)"/>
  <text x="1140" y="675" text-anchor="middle" class="t small orange">No</text>

  <path d="M797 890v27h138" stroke="#107c10" stroke-width="4" fill="none"/>
  <path d="M1072 890v27H935" stroke="#ca5010" stroke-width="4" fill="none"/>
  <path d="M935 917v24" stroke="#107c10" stroke-width="4" fill="none" marker-end="url(#ga)"/>
  <rect x="680" y="941" width="510" height="58" rx="10" fill="#f2fbf2" stroke="#107c10" stroke-width="2"/>
  <text x="935" y="968" text-anchor="middle" class="t head green">2. Validate target state; then remove stale access</text>
  <text x="935" y="990" text-anchor="middle" class="t small">Do not assume a provisioning-policy edit changes every existing Cloud PC</text>

  <rect x="1270" y="400" width="595" height="625" rx="18" fill="#fff8f8" stroke="#c50f1f" stroke-width="3"/>
  <text x="1300" y="442" class="t section red">LEAVER — block access, retain data, deprovision</text>

  <rect x="1320" y="475" width="495" height="78" rx="10" fill="#fff" stroke="#c50f1f" stroke-width="2"/>
  <text x="1567" y="505" text-anchor="middle" class="t head red">1. Block sign-in and revoke active sessions</text>
  <text x="1567" y="532" text-anchor="middle" class="t small">Immediate access control is separate from Cloud PC deletion</text>
  <path d="M1567 553v28" stroke="#c50f1f" stroke-width="4" fill="none" marker-end="url(#ra)"/>

  <rect x="1320" y="581" width="495" height="78" rx="10" fill="#fff" stroke="#8a94a6" stroke-width="2"/>
  <text x="1567" y="611" text-anchor="middle" class="t head">2. Preserve approved business data and evidence</text>
  <text x="1567" y="638" text-anchor="middle" class="t small">Follow retention, legal hold, and offboarding requirements</text>
  <path d="M1567 659v28" stroke="#ca5010" stroke-width="4" fill="none" marker-end="url(#oa)"/>

  <rect x="1320" y="687" width="495" height="78" rx="10" fill="#fff4e8" stroke="#ca5010" stroke-width="2"/>
  <text x="1567" y="717" text-anchor="middle" class="t head orange">3. Remove license or provisioning assignment</text>
  <text x="1567" y="744" text-anchor="middle" class="t small">Enterprise Cloud PC enters grace period</text>
  <path d="M1567 765v20" stroke="#ca5010" stroke-width="4" fill="none" marker-end="url(#oa)"/>

  <rect x="1320" y="785" width="495" height="110" rx="10" fill="#fff4e8" stroke="#ca5010" stroke-width="3"/>
  <text x="1567" y="815" text-anchor="middle" class="t head orange">4. Seven-day grace period</text>
  <text x="1567" y="842" text-anchor="middle" class="t body">User can continue unless account access was already blocked</text>
  <text x="1567" y="868" text-anchor="middle" class="t body">Restore the removed license or assignment to recover the Cloud PC</text>
  <text x="1567" y="889" text-anchor="middle" class="t small">Provisioned and grace-period Cloud PCs both consume active capacity</text>

  <path d="M1460 895v30" stroke="#107c10" stroke-width="4" fill="none" marker-end="url(#ga)"/>
  <path d="M1692 895v30" stroke="#c50f1f" stroke-width="4" fill="none" marker-end="url(#ra)"/>

  <rect x="1320" y="925" width="245" height="75" rx="10" fill="#f2fbf2" stroke="#107c10" stroke-width="3"/>
  <text x="1442" y="955" text-anchor="middle" class="t head green">Eligibility restored</text>
  <text x="1442" y="982" text-anchor="middle" class="t small green">Provisioned; Cloud PC retained</text>

  <rect x="1580" y="925" width="235" height="75" rx="10" fill="#fff0f1" stroke="#c50f1f" stroke-width="3"/>
  <text x="1697" y="950" text-anchor="middle" class="t head red">Grace expires or</text>
  <text x="1697" y="970" text-anchor="middle" class="t head red">Deprovision now</text>
  <text x="1697" y="991" text-anchor="middle" class="t small red">Data deleted; capacity released</text>

  <rect x="45" y="1045" width="1810" height="45" rx="10" fill="#f7f9fc" stroke="#d0d5dd" stroke-width="1"/>
  <circle cx="85" cy="1067" r="7" fill="#2563a9"/><text x="102" y="1072" class="t small">Customer control</text>
  <circle cx="260" cy="1067" r="7" fill="#744da9"/><text x="277" y="1072" class="t small">Identity and groups</text>
  <circle cx="455" cy="1067" r="7" fill="#107c10"/><text x="472" y="1072" class="t small">Preserved or validated</text>
  <circle cx="675" cy="1067" r="7" fill="#ca5010"/><text x="692" y="1072" class="t small">Controlled change</text>
  <circle cx="850" cy="1067" r="7" fill="#c50f1f"/><text x="867" y="1072" class="t small">Access block or destructive action</text>
  <text x="1815" y="1072" text-anchor="end" class="t small">Microsoft Learn verified • Windows 365 Enterprise scope</text>
</svg>
