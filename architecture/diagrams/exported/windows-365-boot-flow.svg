<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530"><rect width="900" height="530" fill="white"/><text x="42" y="48" font-family="Arial" font-size="22" font-weight="bold" fill="#17324D">Windows 365 Boot: physical device to Cloud PC</text><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" viewBox="0 0 14 12"><path d="M0 0L14 6 0 12z" fill="#2563A6"/></marker></defs><rect x="42" y="120" width="235" height="86" rx="12" fill="#EAF3FA" stroke="#2563A6" stroke-width="2"/><text x="159" y="155" text-anchor="middle" font-family="Arial" font-size="15" fill="#17324D">Worker at the physical</text><text x="159" y="177" text-anchor="middle" font-family="Arial" font-size="15" fill="#17324D">device sign-in screen</text><rect x="327" y="120" width="235" height="86" rx="12" fill="#EAF3FA" stroke="#2563A6" stroke-width="2"/><text x="444" y="155" text-anchor="middle" font-family="Arial" font-size="15" fill="#17324D">Windows 365 Boot</text><text x="444" y="177" text-anchor="middle" font-family="Arial" font-size="15" fill="#17324D">Windows App and policy</text><rect x="612" y="120" width="235" height="86" rx="12" fill="#EAF3FA" stroke="#2563A6" stroke-width="2"/><text x="729" y="155" text-anchor="middle" font-family="Arial" font-size="15" fill="#17324D">Assigned personal</text><text x="729" y="177" text-anchor="middle" font-family="Arial" font-size="15" fill="#17324D">Cloud PC</text><rect x="327" y="300" width="235" height="86" rx="12" fill="#EAF3FA" stroke="#2563A6" stroke-width="2"/><text x="444" y="335" text-anchor="middle" font-family="Arial" font-size="15" fill="#17324D">Sign out returns to</text><text x="444" y="357" text-anchor="middle" font-family="Arial" font-size="15" fill="#17324D">physical sign-in</text><path d="M277 163 L327 163" fill="none" stroke="#2563A6" stroke-width="2.5" marker-end="url(#a)"/><path d="M562 163 L612 163" fill="none" stroke="#2563A6" stroke-width="2.5" marker-end="url(#a)"/><path d="M729 206 L729 270 L444 270 L444 300" fill="none" stroke="#2563A6" stroke-width="2.5" marker-end="url(#a)"/><path d="M327 343 L159 343 L159 206" fill="none" stroke="#2563A6" stroke-width="2.5" marker-end="url(#a)"/><text x="42" y="445" font-family="Arial" font-size="13" fill="#536579">Conceptual shared-device flow. Each worker needs a Windows 365 license and a provisioned Cloud PC.</text><text x="42" y="465" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" fill="#536579">The worker signs in once, to the Cloud PC, not to the physical device.</text>
<text x="42" y="485" text-anchor="start" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" fill="#536579">Source: Microsoft Learn, Windows 365 Boot guided scenario (deploy Windows 365 Boot).</text>
</svg>