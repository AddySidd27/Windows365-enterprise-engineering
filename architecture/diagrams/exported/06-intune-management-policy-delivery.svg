<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1050" viewBox="0 0 1900 1050">
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563a9"/></marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#744da9"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#107c10"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#ca5010"/></marker>
    <style>.t{font-family:'Segoe UI',Arial,sans-serif;fill:#172b4d}.title{font-size:31px;font-weight:700}.sub{font-size:17px;fill:#5c6675}.section{font-size:20px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:14px;fill:#364152}.small{font-size:12px;fill:#5c6675}.blue{fill:#2563a9}.purple{fill:#744da9}.green{fill:#107c10}.orange{fill:#ca5010}</style>
  </defs>
  <rect width="1900" height="1050" fill="#fff"/>
  <text x="45" y="58" class="t title">Intune Management and Policy Delivery for Windows 365 Cloud PCs</text>
  <text x="45" y="92" class="t sub">Pilot-group assignments, workload delivery, Cloud PC check-in, reporting, and Windows update content flow</text>

  <rect x="35" y="125" width="1830" height="540" rx="18" fill="#f8fbff" stroke="#264a8a" stroke-width="3"/>
  <text x="65" y="165" class="t section">Customer tenant management plane</text>

  <rect x="70" y="205" width="210" height="125" rx="12" fill="#fff" stroke="#8a94a6" stroke-width="2"/>
  <text x="175" y="245" text-anchor="middle" class="t head">1. IT administrator</text>
  <text x="175" y="279" text-anchor="middle" class="t body">Creates, assigns,</text>
  <text x="175" y="304" text-anchor="middle" class="t body">monitors, and remediates</text>

  <rect x="350" y="190" width="315" height="155" rx="12" fill="#eef8ff" stroke="#0078d4" stroke-width="3"/>
  <text x="507" y="232" text-anchor="middle" class="t head">2. Microsoft Intune admin center</text>
  <text x="507" y="269" text-anchor="middle" class="t body">Windows device management</text>
  <text x="507" y="296" text-anchor="middle" class="t body">policy and application control</text>
  <text x="507" y="323" text-anchor="middle" class="t small">Cloud PC inventory and remote Sync</text>

  <rect x="750" y="190" width="350" height="155" rx="12" fill="#f8f4fc" stroke="#744da9" stroke-width="3"/>
  <text x="925" y="232" text-anchor="middle" class="t head">3. Microsoft Entra groups</text>
  <text x="925" y="270" text-anchor="middle" class="t body">W365-ENT-Pilot-Devices</text>
  <text x="925" y="298" text-anchor="middle" class="t body">W365-ENT-Pilot-Users</text>
  <text x="925" y="325" text-anchor="middle" class="t small">Assignment scope: device or user</text>

  <rect x="1430" y="190" width="365" height="155" rx="12" fill="#f7f9fb" stroke="#8a94a6" stroke-width="3"/>
  <text x="1612" y="232" text-anchor="middle" class="t head">6. Intune reporting</text>
  <text x="1612" y="268" text-anchor="middle" class="t body">Device and user status</text>
  <text x="1612" y="295" text-anchor="middle" class="t body">Per-setting and compliance status</text>
  <text x="1612" y="322" text-anchor="middle" class="t body">App and update deployment status</text>

  <path d="M280 267h70" stroke="#2563a9" stroke-width="5" fill="none" marker-end="url(#blue)"/>
  <text x="315" y="247" text-anchor="middle" class="t small blue">Configure</text>

  <rect x="100" y="410" width="1670" height="205" rx="15" fill="#fff" stroke="#0078d4" stroke-width="2.5"/>
  <text x="130" y="446" class="t head">4. Intune workloads assigned to the pilot groups</text>

  <rect x="135" y="470" width="285" height="115" rx="10" fill="#eef8ff" stroke="#0078d4" stroke-width="2"/>
  <text x="277" y="505" text-anchor="middle" class="t head">Configuration profiles</text>
  <text x="277" y="538" text-anchor="middle" class="t body">Settings Catalog</text>
  <text x="277" y="563" text-anchor="middle" class="t small green">Tested: Edge and wallpaper</text>

  <rect x="455" y="470" width="285" height="115" rx="10" fill="#fff5f5" stroke="#d13438" stroke-width="2"/>
  <text x="597" y="505" text-anchor="middle" class="t head">Endpoint security</text>
  <text x="597" y="538" text-anchor="middle" class="t body">Defender Antivirus and Firewall</text>
  <text x="597" y="563" text-anchor="middle" class="t small green">Tested in pilot</text>

  <rect x="775" y="470" width="285" height="115" rx="10" fill="#f8f4fc" stroke="#744da9" stroke-width="2"/>
  <text x="917" y="505" text-anchor="middle" class="t head">Compliance policy</text>
  <text x="917" y="538" text-anchor="middle" class="t body">Evaluates device requirements</text>
  <text x="917" y="563" text-anchor="middle" class="t small green">Tested: device Compliant</text>

  <rect x="1095" y="470" width="285" height="115" rx="10" fill="#f2fbf2" stroke="#107c10" stroke-width="2"/>
  <text x="1237" y="505" text-anchor="middle" class="t head">Applications</text>
  <text x="1237" y="538" text-anchor="middle" class="t body">Required, Available, Uninstall</text>
  <text x="1237" y="563" text-anchor="middle" class="t small green">Tested: Store apps / Company Portal</text>

  <rect x="1415" y="470" width="320" height="115" rx="10" fill="#fffaf5" stroke="#ca5010" stroke-width="2"/>
  <text x="1575" y="505" text-anchor="middle" class="t head">Windows Update ring</text>
  <text x="1575" y="538" text-anchor="middle" class="t body">Deferrals, deadlines, restart UX</text>
  <text x="1575" y="563" text-anchor="middle" class="t small orange">Pilot created; before/after pending</text>

  <path d="M665 267h85" stroke="#744da9" stroke-width="4" fill="none" marker-end="url(#purple)"/>
  <text x="707" y="247" text-anchor="middle" class="t small purple">Select targets</text>
  <path d="M925 345v65" stroke="#744da9" stroke-width="4" fill="none" marker-end="url(#purple)"/>
  <text x="945" y="382" class="t small purple">Assignments</text>
  <path d="M507 345v65" stroke="#2563a9" stroke-width="4" fill="none" marker-end="url(#blue)"/>
  <text x="527" y="382" class="t small blue">Policies and apps</text>

  <rect x="35" y="700" width="1830" height="285" rx="18" fill="#fff" stroke="#264a8a" stroke-width="3"/>
  <text x="65" y="740" class="t section">Managed Cloud PC and Microsoft update service</text>

  <rect x="610" y="775" width="500" height="160" rx="14" fill="#f2fbf2" stroke="#107c10" stroke-width="3"/>
  <text x="860" y="817" text-anchor="middle" class="t head green">5. Windows 365 Cloud PC</text>
  <text x="860" y="850" text-anchor="middle" class="t body">Microsoft Entra joined and enrolled in Intune</text>
  <text x="860" y="878" text-anchor="middle" class="t body">Receives policies and apps at check-in</text>
  <text x="860" y="906" text-anchor="middle" class="t small">Company Portal supports self-service apps and Check access</text>

  <rect x="1320" y="785" width="400" height="140" rx="14" fill="#eef8ff" stroke="#0078d4" stroke-width="3"/>
  <text x="1520" y="827" text-anchor="middle" class="t head">Microsoft Update service</text>
  <text x="1520" y="863" text-anchor="middle" class="t body">Cloud PC downloads Windows</text>
  <text x="1520" y="890" text-anchor="middle" class="t body">update content from Microsoft</text>

  <path d="M860 615v160" stroke="#2563a9" stroke-width="5" fill="none" marker-end="url(#blue)"/>
  <rect x="885" y="672" width="290" height="45" rx="8" fill="#fff"/>
  <text x="1030" y="694" text-anchor="middle" class="t small blue">MDM policy, app commands, Sync trigger</text>

  <path d="M1000 775v-20h810v-410h-10" stroke="#107c10" stroke-width="4" fill="none" marker-end="url(#green)"/>
  <rect x="1260" y="733" width="300" height="42" rx="8" fill="#fff"/>
  <text x="1410" y="754" text-anchor="middle" class="t small green">Check-in and deployment status</text>

  <path d="M1320 855h-210" stroke="#ca5010" stroke-width="5" fill="none" marker-end="url(#orange)"/>
  <text x="1215" y="835" text-anchor="middle" class="t small orange">Update content</text>

  <text x="65" y="970" class="t small orange">Intune sends update policy, not the update binaries. Reporting can lag behind the device check-in and workload processing.</text>
  <text x="950" y="1025" text-anchor="middle" class="t small">Microsoft Learn basis: Windows 365 architecture and Microsoft Intune policy, app, compliance, Sync, reporting, and update-ring documentation.</text>
</svg>
